[project]
name = "hp-ner"
version = "0.1.0"
description = "Named Entity Recognition for the Harry Potter universe"
requires-python = ">=3.11"

dependencies = [
    # Model + training
    "torch>=2.2",
    "transformers>=4.40",
    "datasets>=2.19",
    "seqeval>=1.2",
    # Tokenizer backends
    "sentencepiece>=0.2",
    "protobuf>=4.0",
    # Scraping + preprocessing
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "spacy>=3.8",
    "pyunormalize>=15.0",
    "langdetect>=1.0.9",
    "datasketch>=1.6",
    # IAA + selection
    "scikit-learn>=1.3",
    # Config + CLI
    "pyyaml>=6.0",
    # Data / utils
    "numpy>=1.26",
    # Plotting (evaluator + aggregate plots)
    "matplotlib>=3.8",
    # LLM reference (GPT-4o zero-shot in train_and_evaluate --with-llm-reference)
    "openai>=1.30",
    "tenacity>=8",
]

[project.scripts]
prepare-annotation = "scripts.prepare_annotation:main"
finalize-gold      = "scripts.finalize_gold:main"
train-and-evaluate = "scripts.train_and_evaluate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "llm_reference"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
# Linux + Windows: install the CUDA 12.8 PyTorch wheel (works on any NVIDIA GPU,
# silently falls back to CPU at runtime via torch.cuda.is_available()==False).
# macOS: use the default PyPI wheel — it bundles MPS for Apple Silicon GPUs.
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
