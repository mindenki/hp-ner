[project]
name = "hp-ner"
version = "0.1.0"
description = "Named Entity Recognition for the Harry Potter universe"
requires-python = ">=3.11"

dependencies = [
    # Model + training
    "torch>=2.2",
    "transformers>=4.40",
    "datasets>=2.19",
    "seqeval>=1.2",
    # Tokenizer backends
    "sentencepiece>=0.2",
    "protobuf>=4.0",
    # Config + CLI
    "pyyaml>=6.0",
    # Data / utils
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["baseline/src"]
